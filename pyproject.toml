[project]
name = "fisheye-tools"
version = "0.1.0"
description = "Shared fisheye lens models and rig utilities for the 3d_fisheye SLAM evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "rosbags>=0.9.22",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tools/fisheye/tests", "bench/tests"]

# Plain script/tool collection, not an installable package.
[tool.uv]
package = false
