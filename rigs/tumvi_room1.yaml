# TUM-VI room1 (real 512x512 fisheye stereo + 200 Hz IMU) as a rig for the
# bag-based runners — the Round-1 evaluation data (docs/EVAL_2026-07-06).
#
# REAL-calibration rig: cameras carry the Kalibr `T_cam_imu` (IMU frame ->
# camera optical frame, exactly as in bench/configs/openvins_tumvi/
# kalibr_imucam_chain.yaml) instead of FLU pod mounts, plus the bag's own
# topic names. Consumed by experiments/08_oakdpro_slam/cuvslam_track.py
# (sim rigs use mounts; real rigs use T_cam_imu). Not a sim rig:
# rig_math.load_rig() does not resolve it.

name: tumvi_room1
imu:
  topic: /imu0
  rate_hz: 200
  gyro_noise_density: 0.00016
  gyro_random_walk: 2.2e-05
  accel_noise_density: 0.0028
  accel_random_walk: 0.00086

